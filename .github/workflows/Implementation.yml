name: Implementation

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * 5'
  workflow_dispatch:

jobs:

  Matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}

    steps:

    - name: '🧰 Repository Checkout'
      uses: actions/checkout@v7

    - name: '🔧 Generate examples matrix'
      id: generate
      run: ./.github/generate-job-matrix.py

  All-in-one:
    needs: Matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.Matrix.outputs.matrix) }}
    name: '🛳️ All-in-one | ${{ matrix.board }} · ${{ matrix.design }}'

    steps:

    - name: '🧰 Repository Checkout'
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: recursive

    - name: '📦 Install OSS-CAD-Suite'
      run: |
        wget https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-09-12/oss-cad-suite-linux-x64-20260912.tgz
        mkdir $GITHUB_WORKSPACE/oss_cad
        tar -xzf oss-cad-suite-linux-x64-20260912.tgz -C $GITHUB_WORKSPACE/oss_cad
        echo "$GITHUB_WORKSPACE/oss_cad/oss-cad-suite//bin" >> $GITHUB_PATH

    - name: '🚧 Generate ${{ matrix.board }} ${{ matrix.design }} bitstream'
      run: |
        make -C osflow BOARD=${{ matrix.board }} ${{ matrix.design }}

    - name: '📤 Upload Artifact: ${{ matrix.board }} ${{ matrix.design }} bitstream and reports'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.board }}-${{ matrix.design }}
        path: |
          osflow/${{ matrix.bitstream }}
          osflow/${{ matrix.board }}/*-report.txt
